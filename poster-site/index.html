<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NO MATTER WHAT YOU DO</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="stage">
  <main class="collage" aria-label="Poster: no matter what you do, I must eventually become myself">

    <!-- ============ BASE ============ -->
    <div class="paper"></div>
    <div class="band-blue-left" data-drift="2"></div>
    <div class="bar-black-top"></div>
    <div class="line-blue-thin-top"></div>

    <!-- ============ CURVES / ORBITS ============ -->
    <svg class="curves" viewBox="0 0 540 1200" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke-linecap="round">
        <path d="M40 300 C 120 250, 210 190, 330 210 C 420 225, 470 180, 540 120" stroke="#151BD8" stroke-width=".8" opacity=".8"/>
        <path d="M10 240 C 90 300, 200 250, 300 300 C 400 350, 480 300, 540 260" stroke="#151BD8" stroke-width=".6" opacity=".55"/>
        <path d="M60 470 C 150 420, 260 470, 350 400 C 420 345, 500 380, 540 340" stroke="#151BD8" stroke-width=".6" opacity=".5"/>
        <path d="M0 620 C 110 560, 240 620, 350 560 C 440 510, 510 540, 540 520" stroke="#050505" stroke-width=".55" opacity=".4"/>
        <path d="M0 760 C 90 700, 190 790, 300 700 C 390 626, 470 700, 540 640" stroke="#151BD8" stroke-width=".7" opacity=".55"/>
        <path d="M0 900 C 120 830, 230 930, 350 850 C 440 790, 500 850, 540 810" stroke="#050505" stroke-width=".5" opacity=".32"/>
        <path d="M-40 1080 C 80 980, 220 1080, 340 990 C 430 925, 500 980, 560 930" stroke="#151BD8" stroke-width=".8" opacity=".65"/>
        <path d="M120 -20 C 60 120, 120 240, 60 360 C 10 460, 90 520, 40 640" stroke="#151BD8" stroke-width=".6" opacity=".45"/>
        <path d="M420 -30 C 520 80, 400 200, 470 320 C 530 420, 460 520, 520 620" stroke="#050505" stroke-width=".45" opacity=".3"/>
        <ellipse cx="186" cy="186" rx="152" ry="120" stroke="#151BD8" stroke-width="1.1" opacity=".6" transform="rotate(-14 186 186)"/>
        <ellipse cx="120" cy="150" rx="122" ry="46" stroke="#151BD8" stroke-width=".8" opacity=".65" transform="rotate(-22 120 150)"/>
        <ellipse cx="415" cy="1078" rx="238" ry="124" stroke="#151BD8" stroke-width=".9" opacity=".55" transform="rotate(12 415 1078)"/>
      </g>
    </svg>

    <!-- ============ TOP LEFT CLUSTER ============ -->
    <div class="dotfield dotfield--top" data-drift="3"></div>

    <div class="circle-gray">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 3 C53 31 67 45 97 50 C67 55 53 69 50 97 C47 69 33 55 3 50 C33 45 47 31 50 3 Z" fill="#F0F0EE"/>
      </svg>
    </div>
    <div class="ring-blue-left"></div>

    <!-- ============ BLUEPRINT PANELS ============ -->
    <div class="panel panel-a1"></div>
    <div class="panel panel-a2"></div>
    <div class="panel panel-b" data-drift="1"></div>
    <div class="panel panel-c"></div>
    <div class="panel panel-d"></div>
    <div class="panel panel-e"></div>
    <div class="panel panel-f"></div>

    <!-- ============ SOLID BLOCKS ============ -->
    <div class="blk blk-lavender-right"></div>
    <div class="blk blk-blue-tall-right"></div>
    <div class="blk blk-black-a"></div>
    <div class="blk blk-black-b"></div>
    <div class="blk blk-blue-c"></div>
    <div class="blk blk-blue-d"></div>
    <div class="blk blk-blue-e"></div>
    <div class="blk blk-blue-f"></div>
    <div class="blk blk-black-bottom"></div>
    <div class="blk blk-blue-bottom"></div>
    <div class="blk blk-black-small-bottom"></div>
    <div class="blk blk-white-square"></div>

    <div class="halftone-band"></div>
    <div class="halftone-corner"></div>
    <div class="glitch-block"></div>

    <!-- ============ LARGE RINGS / LAVENDER ============ -->
    <div class="ring-black-big"></div>
    <div class="ring-blue-big"></div>
    <div class="ring-blue-ellipse" data-drift="5"></div>
    <div class="circle-lavender"></div>
    <div class="circle-black-solid"></div>
    <div class="dot-pin-circle"></div>

    <!-- ============ BIRDS ============ -->
    <svg class="defs" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="dove" viewBox="0 0 100 70">
          <path d="M70 30 L98 18 L92 38 Z"/>
          <ellipse cx="48" cy="32" rx="24" ry="8.5" transform="rotate(-12 48 32)"/>
          <circle cx="24" cy="25" r="5.5"/>
          <path d="M18 24 L10 22 L18 28 Z"/>
          <path d="M44 30 C46 15 54 5 68 2 C62 13 64 23 72 30 C62 33 52 33 44 30 Z"/>
          <path d="M46 34 C56 42 66 47 78 46 C70 51 58 50 48 44 Z"/>
        </symbol>
        <symbol id="goose" viewBox="0 0 100 70">
          <path d="M74 34 L100 24 L94 44 Z"/>
          <ellipse cx="52" cy="34" rx="26" ry="10"/>
          <path d="M34 28 C30 20 28 12 32 6 C36 2 42 4 42 10 C42 16 40 22 42 28 Z"/>
          <circle cx="34" cy="7" r="5"/>
          <path d="M28 6 L20 5 L28 10 Z"/>
          <path d="M50 32 C52 16 62 6 76 4 C70 16 72 26 80 32 C70 35 58 35 50 32 Z"/>
        </symbol>
      </defs>
    </svg>

    <div class="birds" aria-hidden="true">
      <svg class="bird bird-goose" viewBox="0 0 100 70"><use href="#goose"/></svg>
      <svg class="bird bird-1" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-2" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-3" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-4" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-5" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-6" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-7" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-8" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-9" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-10" viewBox="0 0 100 70"><use href="#dove"/></svg>
      <svg class="bird bird-blue" viewBox="0 0 100 70"><use href="#dove"/></svg>
    </div>

    <!-- ============ HANDS ============ -->
    <div class="hand-wrap hand-light-wrap" data-drift="2">
      <img class="hand hand-light" src="assets/hand-light.png" alt="" />
    </div>
    <div class="wrist-shadow"></div>
    <div class="wrist-fade"></div>
    <div class="panel panel-over"></div>
    <div class="hand-wrap hand-dark-wrap" data-drift="1">
      <img class="hand hand-dark" src="assets/hand-dark.png" alt="" />
    </div>

    <!-- ============ TYPE ============ -->
    <div class="label-blue label-blue-a">
      <span>All is well and the end<br>you're still alive</span>
    </div>
    <div class="label-blue label-blue-b"><span>still alive</span></div>

    <p class="type-block">
      No matter what<br>
      you do, I must eventually<br>
      become myself.<br>
      I will endure it,<br>
      I will have to see,<br>
      I will be free.
    </p>

    <p class="type-block type-block--right">
      I keep<br>
      waiting for<br>
      permission.
    </p>

    <p class="type-white-bottom">
      You finally have no reason<br>
      to be valuable<br>
      congratulations
    </p>

    <!-- ============ OVERLAYS ============ -->
    <div class="grain"></div>
    <div class="print-defects" data-drift="4"></div>
  </main>
</div>

<script src="js/main.js"></script>
</body>
</html>
